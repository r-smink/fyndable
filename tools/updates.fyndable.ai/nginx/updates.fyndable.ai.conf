# Nginx virtual host voor updates.fyndable.ai
#
# Plaats dit bestand in /etc/nginx/sites-available/updates.fyndable.ai
# en symlink het naar sites-enabled:
#
#   sudo cp updates.fyndable.ai.conf /etc/nginx/sites-available/updates.fyndable.ai
#   sudo ln -s /etc/nginx/sites-available/updates.fyndable.ai /etc/nginx/sites-enabled/updates.fyndable.ai
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# HTTPS wordt toegevoegd door:
#   sudo certbot --nginx -d updates.fyndable.ai --redirect --agree-tos -m jouw@email.nl
#
# Certbot voegt automatisch een `listen 443 ssl;` server-block toe en een
# 80 -> 443 redirect. Je hoeft hieronder dus geen SSL-block te schrijven.

server {
    listen 80;
    listen [::]:80;
    server_name updates.fyndable.ai;

    root /var/www/updates.fyndable.ai/public_html;
    index latest.json;

    # Geen directory listing (equivalent van Apache `Options -Indexes`).
    autoindex off;

    # Globale access/error logs.
    access_log /var/log/nginx/updates.fyndable.ai-access.log combined;
    error_log  /var/log/nginx/updates.fyndable.ai-error.log;

    # Standaard-serving: serveer statische bestanden, val terug op 404.
    location / {
        try_files $uri =404;
    }

    # JSON metadata: juiste MIME-type (kritiek, anders sommige clients
    # weigeren het bestand) en geen caching zodat clients altijd de verse
    # `latest.json` zien.
    location ~ \.json$ {
        default_type application/json;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # SHA256-integrity hashes als plain text.
    location ~ \.sha256$ {
        default_type text/plain;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Plugin zips mogen lang gecached worden (grote bestanden, wijzigen
    # zelden - alleen bij nieuwe releases, en dan verandert de bestandsnaam).
    location ~ \.zip$ {
        default_type application/zip;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Verberg eventuele verborgen bestanden (.htaccess-achtige restanten,
    # .git, etc.) - Nginx serveert ze niet standaard, maar expliciet is beter.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
