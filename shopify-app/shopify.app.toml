# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "a8c61aa96e7cfd0ac63fb005d272effb"
name = "Fyndable Smart SEO"
application_url = "https://shopify.fyndable.ai/dashboard"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "https://shopify.fyndable.ai/webhooks"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_content,read_metaobjects,read_products,read_themes,write_app_proxy,write_content,write_metaobjects,write_products"

[auth]
redirect_urls = [ "https://shopify.fyndable.ai/auth/callback" ]

[app_proxy]
url = "https://shopify.fyndable.ai/api"
subpath = "fyndable"
prefix = "apps"
