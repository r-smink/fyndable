</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  rootRef = React.createRef();
  componentDidMount() {
    const root = this.rootRef.current; if (!root) return;
    const els = root.querySelectorAll('[data-anim]');
    els.forEach(el => { el.style.opacity = 0; el.style.transform = el.dataset.anim === 'left' ? 'translateX(-30px)' : 'translateY(24px)'; });
    this.io = new IntersectionObserver(es => es.forEach(en => {
      const el = en.target, d = +(el.dataset.delay || 0);
      if (en.isIntersecting) setTimeout(() => { el.style.transition = 'opacity .6s ease, transform .6s ease, border-color .2s ease, box-shadow .2s ease'; el.style.opacity = 1; el.style.transform = ''; setTimeout(() => { el.style.transition = 'transform .2s ease, border-color .2s ease, box-shadow .2s ease'; }, 650); }, d);
    }), { threshold: 0.3 });
    els.forEach(el => this.io.observe(el));
    root.querySelectorAll('[data-pill]').forEach(p => {
      const fills = [...p.querySelectorAll('[data-fill]')], kids = [...p.querySelectorAll('i,span:not([data-fill])')];
      kids.forEach(k => { k.dataset.c = k.style.color; k.dataset.b = k.style.background; k.style.transition = 'color .3s ease .2s, background .3s ease .2s'; });
      const bc = p.style.borderColor;
      p.addEventListener('mouseenter', () => { fills.forEach((fl, i) => fl.style.translate = i ? '0 calc(-100% + 62px)' : '0 calc(-100% + 70px)'); p.style.transform = 'translateY(-2px)'; p.style.borderColor = '#8F39AC'; p.style.boxShadow = '0 8px 20px rgba(143,57,172,.3)';
        kids.forEach(k => { k.style.color = '#fff'; if (k.dataset.b) k.style.background = 'rgba(255,255,255,.22)'; }); });
      p.addEventListener('mouseleave', () => { fills.forEach(fl => fl.style.translate = '0 calc(-100% - 60px)'); p.style.transform = ''; p.style.borderColor = bc; p.style.boxShadow = '';
        kids.forEach(k => { k.style.color = k.dataset.c; if (k.dataset.b) k.style.background = k.dataset.b; }); });
    });
  }
  componentWillUnmount() { this.io && this.io.disconnect(); }
  renderVals() { return { rootRef: this.rootRef }; }
}
</script>
